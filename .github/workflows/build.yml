name: Build EXE

on:
  push:
    tags:
      - 'V*'  # Wird ausgelöst wenn du z.B. "v1.0" als Tag pushst

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: PyInstaller installieren
        run: pip install pyinstaller

      - name: EXE bauen
        run: pyinstaller --onefile --windowed --name Waehrungsumrechner Main.py

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Waehrungsumrechner.exe
